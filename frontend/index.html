    <script>
      (function() {
        function blockReload(e) {
          var k = (e.key || '').toLowerCase();
          var c = e.code || '';
          var code = e.keyCode || e.which;
          if (k === 'f5' || c === 'F5' || code === 116 || k === 'browserrefresh' ||
              ((e.ctrlKey || e.metaKey) && (k === 'r' || c === 'KeyR' || code === 82))) {
            e.preventDefault();
            e.stopPropagation();
            if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
            e.returnValue = false;
            return false;
          }
        }
        window.addEventListener('keydown', blockReload, true);
        document.addEventListener('keydown', blockReload, true);
        window.addEventListener('keyup', blockReload, true);
      })();
    </script>
